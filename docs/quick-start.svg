<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Collabsprite in drei Schritten</title>
  <desc id="desc">Erweiterung auf beiden PCs installieren, auf dem Host eine Sitzung erstellen und als Gast per Einladungscode im selben LAN oder über Radmin VPN beitreten.</desc>
  <rect width="1200" height="580" rx="20" fill="#171b24"/>
  <rect x="0" y="0" width="1200" height="8" fill="#8f72ff"/>
  <text x="44" y="56" fill="#f3f4ff" font-family="Arial,sans-serif" font-size="28" font-weight="700">COLLABSPRITE</text>
  <text x="44" y="88" fill="#aeb8cf" font-family="Arial,sans-serif" font-size="18">Gemeinsam zeichnen – in drei Schritten</text>
  <g font-family="Arial,sans-serif">
    <rect x="44" y="125" width="340" height="348" rx="14" fill="#222838" stroke="#46516b" stroke-width="2"/>
    <circle cx="83" cy="163" r="20" fill="#8f72ff"/><text x="77" y="170" fill="#171b24" font-size="20" font-weight="700">1</text>
    <text x="114" y="170" fill="#f3f4ff" font-size="23" font-weight="700">Installieren</text>
    <text x="68" y="209" fill="#b6c2d8" font-size="16">Auf Host und Gästen:</text>
    <rect x="68" y="235" width="292" height="68" rx="8" fill="#333b50" stroke="#59657d"/>
    <text x="85" y="261" fill="#e8ebff" font-size="15" font-weight="700">Collabsprite.aseprite-extension</text>
    <text x="85" y="285" fill="#aeb8cf" font-size="14">eine Datei · gleiche Version</text>
    <text x="68" y="345" fill="#e8ebff" font-size="16">Aseprite → Bearbeiten</text>
    <text x="68" y="371" fill="#e8ebff" font-size="16">→ Einstellungen → Erweiterungen</text>
    <text x="68" y="397" fill="#e8ebff" font-size="16">→ Erweiterung hinzufügen</text>
    <text x="68" y="443" fill="#aeb8cf" font-size="15">Danach Aseprite neu starten.</text>
    <path d="M396 292 H414 M408 284 L416 292 L408 300" fill="none" stroke="#8f72ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="430" y="125" width="340" height="348" rx="14" fill="#222838" stroke="#46516b" stroke-width="2"/>
    <circle cx="469" cy="163" r="20" fill="#69d1a1"/><text x="463" y="170" fill="#171b24" font-size="20" font-weight="700">2</text>
    <text x="500" y="170" fill="#f3f4ff" font-size="23" font-weight="700">Host erstellt</text>
    <text x="454" y="209" fill="#b6c2d8" font-size="16">RGB-Bild öffnen, dann:</text>
    <rect x="454" y="235" width="292" height="163" rx="8" fill="#333b50" stroke="#59657d"/>
    <text x="472" y="265" fill="#e8ebff" font-size="16" font-weight="700">Ansicht → Collabsprite…</text>
    <text x="472" y="296" fill="#b6c2d8" font-size="15">Erstellen · LAN oder Radmin VPN</text>
    <rect x="472" y="316" width="255" height="36" rx="6" fill="#8f72ff"/>
    <text x="529" y="340" fill="#171b24" font-size="15" font-weight="700">Sitzung erstellen</text>
    <text x="472" y="381" fill="#b6c2d8" font-size="15">Einladung kopieren</text>
    <text x="454" y="443" fill="#aeb8cf" font-size="15">Nur der Host braucht Node.js.</text>
    <path d="M782 292 H800 M794 284 L802 292 L794 300" fill="none" stroke="#8f72ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="816" y="125" width="340" height="348" rx="14" fill="#222838" stroke="#46516b" stroke-width="2"/>
    <circle cx="855" cy="163" r="20" fill="#f6c56b"/><text x="849" y="170" fill="#171b24" font-size="20" font-weight="700">3</text>
    <text x="886" y="170" fill="#f3f4ff" font-size="23" font-weight="700">Gast tritt bei</text>
    <text x="840" y="209" fill="#b6c2d8" font-size="16">Gleiches LAN oder Radmin-Netz:</text>
    <rect x="840" y="235" width="292" height="163" rx="8" fill="#333b50" stroke="#59657d"/>
    <text x="858" y="265" fill="#e8ebff" font-size="16" font-weight="700">Ansicht → Collabsprite…</text>
    <text x="858" y="296" fill="#b6c2d8" font-size="15">Beitreten · ohne Moduswahl</text>
    <rect x="858" y="316" width="255" height="36" rx="6" fill="#202635" stroke="#8f72ff"/>
    <text x="877" y="340" fill="#e8ebff" font-size="15">Einladungscode einfügen</text>
    <text x="858" y="381" fill="#b6c2d8" font-size="15">Beitreten → Verbunden</text>
    <text x="840" y="443" fill="#aeb8cf" font-size="15">Oder Sitzung im Netz suchen.</text>
    <rect x="44" y="499" width="1112" height="50" rx="9" fill="#2d3548"/>
    <circle cx="74" cy="524" r="6" fill="#69d1a1"/>
    <text x="94" y="530" fill="#e8ebff" font-size="16">Verschiedene PCs: im selben LAN direkt, sonst über gemeinsames Radmin VPN</text>
  </g>
</svg>
